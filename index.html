<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulado AWS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    h1, h2 {
      color: #222;
    }
    .question {
      margin-bottom: 20px;
    }
    .answers label {
      display: block;
      margin-left: 20px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Simulado AWS</h1>
  <div id="exam"></div>
  <button onclick="submitExam()">Finalizar Simulado</button>
  <p id="result"></p>

  <script>
    let examData = null;
    let selectedAnswers = {};

    async function loadExam() {
      const res = await fetch("http://localhost:3000/exam/1");
      examData = await res.json();

      const container = document.getElementById("exam");
      container.innerHTML = `<h2>${examData.title}</h2><p>${examData.description}</p>`;

      examData.questions.forEach(q => {
        const qDiv = document.createElement("div");
        qDiv.className = "question";
        qDiv.innerHTML = `<p><strong>${q.number}. ${q.statement}</strong></p>`;

        const answersDiv = document.createElement("div");
        answersDiv.className = "answers";

        q.answers.forEach(a => {
          const label = document.createElement("label");
          label.innerHTML = `
            <input type="radio" name="question-${q.id}" value="${a.id}">
            ${a.letter}) ${a.text}
          `;
          answersDiv.appendChild(label);
        });

        qDiv.appendChild(answersDiv);
        container.appendChild(qDiv);
      });
    }

    async function submitExam() {
      const answers = [];
      examData.questions.forEach(q => {
        const selected = document.querySelector(`input[name="question-${q.id}"]:checked`);
        if (selected) {
          answers.push({ questionId: q.id, answerId: Number(selected.value) });
        }
      });

      const res = await fetch(`http://localhost:3000/exam/${examData.id}/submit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers })
      });
      const result = await res.json();

      document.getElementById("result").innerHTML =
        `Pontuação: ${result.score.toFixed(2)}%<br>` +
        `Corretas: ${result.correctCount}/${result.total}<br>` +
        (result.passed ? "✅ Aprovado!" : "❌ Reprovado!");
    }

    loadExam();
  </script>
</body>
</html>
