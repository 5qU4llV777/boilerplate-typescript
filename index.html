<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulado AWS</title>
</head>
<body>
  <h1>Simulado AWS</h1>
  <div id="exam"></div>

  <script>
    async function loadExam() {
      const res = await fetch("http://localhost:3000/exam/1");
      const exam = await res.json();

      const container = document.getElementById("exam");
      container.innerHTML = `<h2>${exam.title}</h2><p>${exam.description}</p>`;

      exam.questions.forEach(q => {
        const qDiv = document.createElement("div");
        qDiv.innerHTML = `<p>${q.number}. ${q.statement}</p>`;
        
        q.answers.forEach(a => {
          const btn = document.createElement("button");
          btn.textContent = `${a.letter}) ${a.text}`;
          btn.onclick = () => submitAnswer(exam.id, q.id, a.id);
          qDiv.appendChild(btn);
        });

        container.appendChild(qDiv);
      });
    }

    async function submitAnswer(examId, questionId, answerId) {
      const res = await fetch(`http://localhost:3000/exam/${examId}/answer`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ questionId, answerId })
      });
      const data = await res.json();
      alert(data.correct ? "✅ Correto!" : "❌ Errado!");
    }

    loadExam();
  </script>
</body>
</html>
